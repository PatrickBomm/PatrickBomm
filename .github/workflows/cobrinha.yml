name: Generate Snake And Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate snake and stats cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prefer GH_PAT (PAT with read:user) so private contributions also appear.
      # Falls back to the default Actions token for public contributions only.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: PatrickBomm
          github_token: ${{ secrets.GH_PAT || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
        with:
          USERNAME: PatrickBomm
          UTC_OFFSET: -3
          AUTO_PUSH: false

      # snk runs in a Docker container as root, so dist/ ends up root-owned
      # and the following steps (running as `runner`) cannot write into it.
      - name: Collect generated assets
        run: |
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          cp profile-summary-card-output/github_dark/*.svg dist/
          ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
